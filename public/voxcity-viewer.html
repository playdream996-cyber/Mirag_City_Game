<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirag City — Full 4km VoxCity</title>
  <style>
    html,body,#renderCanvas{width:100%;height:100%;margin:0;overflow:hidden;background:#93b7d3}
    body{font-family:Inter,system-ui,sans-serif}
    #renderCanvas{display:block;touch-action:none}
    #hud{position:fixed;left:16px;top:16px;z-index:10;background:#07131fcc;color:#fff;border:1px solid #6f91aa;border-radius:10px;padding:12px 14px;backdrop-filter:blur(8px);box-shadow:0 8px 28px #0005;max-width:360px}
    #hud b{font-size:15px;letter-spacing:.02em}
    #status{margin-top:5px;font-size:12px;color:#cfe4f3;line-height:1.45}
    #controls{position:fixed;right:16px;top:16px;z-index:10;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:420px}
    button,a{border:1px solid #58778e;border-radius:8px;background:#0d2638e8;color:#fff;padding:9px 12px;font:700 12px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none}
    button:hover,a:hover{background:#173d56}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07111a;color:#fff;z-index:20;font:700 16px Inter,system-ui,sans-serif}
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="loading">Loading full 4,000m Mirag City…</div>
  <div id="hud">
    <b>MIRAG CITY — FULL VOXCITY 3D</b>
    <div id="status">4,000m × 4,000m generated city shell<br>Drag = orbit • Wheel = zoom • Right-drag = pan</div>
  </div>
  <div id="controls">
    <button id="fullView">FULL CITY</button>
    <button id="topView">TOP VIEW</button>
    <button id="streetView">STREET VIEW</button>
    <a href="../">BACK TO GAME</a>
  </div>

  <script>
    const canvas = document.getElementById('renderCanvas');
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.58, 0.72, 0.83, 1);

    const camera = new BABYLON.ArcRotateCamera('camera', -Math.PI / 2.1, 0.92, 5200, BABYLON.Vector3.Zero(), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 50;
    camera.upperRadiusLimit = 9000;
    camera.lowerBetaLimit = 0.08;
    camera.upperBetaLimit = Math.PI / 2.05;
    camera.wheelDeltaPercentage = 0.01;
    camera.panningSensibility = 30;
    camera.minZ = 1;
    camera.maxZ = 15000;

    const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0.2, 1, 0.1), scene);
    hemi.intensity = 1.25;
    hemi.groundColor = new BABYLON.Color3(0.25, 0.29, 0.34);
    const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.45, -1, -0.35), scene);
    sun.position = new BABYLON.Vector3(1800, 2600, 1200);
    sun.intensity = 1.6;

    const fullView = () => {
      camera.setTarget(BABYLON.Vector3.Zero());
      camera.alpha = -Math.PI / 2.1;
      camera.beta = 0.92;
      camera.radius = 5200;
    };
    document.getElementById('fullView').onclick = fullView;
    document.getElementById('topView').onclick = () => {
      camera.setTarget(BABYLON.Vector3.Zero());
      camera.alpha = -Math.PI / 2;
      camera.beta = 0.12;
      camera.radius = 5200;
    };
    document.getElementById('streetView').onclick = () => {
      camera.setTarget(new BABYLON.Vector3(0, 60, 0));
      camera.alpha = -Math.PI / 2.4;
      camera.beta = 1.25;
      camera.radius = 850;
    };

    BABYLON.SceneLoader.AppendAsync('./assets/city/', 'mirage-city-voxcity.glb', scene).then(() => {
      let meshCount = 0;
      let vertices = 0;
      for (const mesh of scene.meshes) {
        if (!mesh.getTotalVertices) continue;
        const v = mesh.getTotalVertices();
        if (v > 0) { meshCount++; vertices += v; mesh.receiveShadows = true; }
      }
      status.innerHTML = `4,000m × 4,000m generated city shell<br>${meshCount} render meshes • ${vertices.toLocaleString()} vertices<br>Drag = orbit • Wheel = zoom • Right-drag = pan`;
      loading.style.display = 'none';
      fullView();
    }).catch((err) => {
      console.error(err);
      loading.textContent = 'Failed to load the full city GLB. Refresh the page.';
    });

    engine.runRenderLoop(() => scene.render());
    addEventListener('resize', () => engine.resize());
  </script>
</body>
</html>
