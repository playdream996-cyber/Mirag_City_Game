<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Mirag City Game</title>
  <style>
    html, body, #app, canvas { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:#05070c; font-family:Inter,system-ui,sans-serif; }
    canvas { display:block; touch-action:none; }
  </style>
  <script>
    (() => {
      const RECOVERY_KEY = "mirag-pages-recovery";
      const isRecoverableAssetFailure = (target) => {
        if (!(target instanceof HTMLElement)) return false;
        return target.tagName === "SCRIPT" || target.tagName === "LINK";
      };

      window.addEventListener("error", (event) => {
        if (!isRecoverableAssetFailure(event.target)) return;
        if (sessionStorage.getItem(RECOVERY_KEY) === "1") return;

        sessionStorage.setItem(RECOVERY_KEY, "1");
        const url = new URL(window.location.href);
        url.searchParams.set("deploy", Date.now().toString());
        window.location.replace(url.toString());
      }, true);

      window.addEventListener("load", () => {
        sessionStorage.removeItem(RECOVERY_KEY);
      });
    })();
  </script>
</head>
<body>
  <div id="app"><canvas id="renderCanvas"></canvas></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
